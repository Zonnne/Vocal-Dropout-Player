name: Release

# Bump "version" in package.json, then: git tag v1.0.1 && git push --tags
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-mac:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # one arch per job: both DMGs mount the same volume name, and a stale
      # mount from the first build makes the second one's hdiutil detach fail
      - name: Detach stale DMG mounts
        run: hdiutil detach "/Volumes/Vocal Dropout Player" -force 2>/dev/null || true
      - name: Build & publish DMG
        run: npx electron-builder --mac --${{ matrix.arch }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # unsigned build — drop this once you add an Apple Developer cert
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  build-win:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build & publish installers
        run: npx electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
